services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midosis_backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - ./data/cenabast:/app/data/cenabast
    env_file:
      - .env
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PORT=5000
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-midosis_db}
      - MYSQL_USER=${MYSQL_USER:-midosis_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-midosis_password}
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://midosis_user:midosis_password@mysql:3306/midosis_db}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:9.1
    container_name: midosis_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-midosis_db}
      MYSQL_USER: ${MYSQL_USER:-midosis_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-midosis_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
